<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
     <h1 class="title">Our Mehandi Gallery</h1>

  <div class="card-container">
    <div class="card" data-category="bridal">Bridal</div>
    <div class="card" data-category="festival">Figure Mehandi</div>
    <div class="card" data-category="normal">Festival</div>
    <div class="card" data-category="baby">Baby Shower</div>
    <div class="card" data-category="guest">Guest</div>
    <div class="card" data-category="figure">Normal</div>
  </div>

  <!-- Popup Modal -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <span class="close-btn" id="closeBtn">&times;</span>
      <h2 id="popupTitle"></h2>
      <div class="image-grid" id="imageGrid"></div>
    </div>
  </div>





    <script src="gallery.js"></script>
</body>
</html>
